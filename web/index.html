<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Relay Lineup Optimizer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.1/build/stlite.css" />
    <style>
      #loading { font-family: system-ui, sans-serif; margin: 3rem auto; max-width: 36rem; padding: 0 1rem; color: #444; }
    </style>
  </head>
  <body>
    <div id="root">
      <p id="loading">Loading the relay lineup optimizer. The first visit takes 20 to 40 seconds while Python loads in your browser; after that it's faster.</p>
    </div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.1/build/stlite.js";
      const files = ["app.py", "model.py", "times.py", "solver.py", "sample_data.csv"];
      mount(
        {
          requirements: ["pandas", "scipy"],
          entrypoint: "app.py",
          files: Object.fromEntries(files.map((f) => [f, { url: `./${f}` }])),
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
